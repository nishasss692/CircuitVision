services:
  neo4j:
    image: neo4j:5.12
    container_name: f1_graph_db
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/DeployFest2026!
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./data/neo4j/data:/data

  api:
    build: .
    container_name: f1_fastapi
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_AUTH=neo4j/DeployFest2026!
    depends_on:
      neo4j:
        condition: service_healthy