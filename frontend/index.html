<!DOCTYPE html>
<html class="dark" lang="en">
  <head>

        darkMode: "class",
        theme: {
          extend: {

              "obsidian-base": "#080808",

              "surface": "#131319",

              "surface-container-low": "#1b1b21",
              "surface-container": "#1f1f25",
              "surface-container-high": "#2a2930",
              "surface-container-highest": "#35343b",
              "pit-wall-border": "#201f28",
              "aero-slate": "#949498",
              "primary": "#ffb4a8",
              "primary-container": "#E10600",
              "inverse-primary": "#c00500",
              "secondary": "#c7c5d1",

              "tertiary": "#b6c4ff",
